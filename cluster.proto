syntax = "proto3";

package cluster;

message NodeInfo {
    int32 node_id = 1;
    int32 term = 2;
    string role = 3;
}

message Response {
    bool success = 1;
    string message = 2;
}

message VoteRequest {
    int32 candidate_id = 1;
    int32 term = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message VoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

service ClusterService {
    rpc Heartbeat(NodeInfo) returns (Response);
    rpc RequestVote(VoteRequest) returns (VoteResponse);
    rpc Fetch(FetchRequest) returns (FetchResponse);
    rpc Write(WriteRequest) returns (WriteResponse);
    rpc Read(ReadRequest) returns (ReadResponse);
    rpc Status(StatusRequest) returns (StatusResponse);
}

message LogEntry {
    int32 index = 1;
    int32 term = 2;
    string operation = 3;
    string key = 4;
    string value = 5;
}

message FetchRequest {
    int32 node_id = 1;
    int32 term = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
    int32 commit_index = 5;
}

message FetchResponse {
    int32 term = 1;
    int32 leader_id = 2;
    bool success = 3;
    repeated LogEntry entries = 4;
    int32 leader_commit = 5;
    bool diverged = 6;
    int32 truncate_to = 7;
}


message WriteRequest {
    string key = 1;
    string value = 2;
    bool crash_after_append = 3;
}

message WriteResponse {
    bool success = 1;
    string message = 2;
    int32 term = 3;
    int32 leader_id = 4;
    int32 index = 5;
}

message ReadRequest {
    string key = 1;
}

message ReadResponse {
    bool found = 1;
    string value = 2;
    int32 node_id = 3;
    string role = 4;
    int32 term = 5;
    int32 commit_index = 6;
}

message StatusRequest {
}

message StatusResponse {
    int32 node_id = 1;
    string role = 2;
    int32 term = 3;
    int32 commit_index = 4;
    int32 last_applied = 5;
    int32 leader_id = 6;
    int32 voted_for = 7;
    repeated LogEntry log = 8;
    map<string, string> data = 9;
}